name: Security assurance

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  application-security:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.lock
            requirements-security.txt
      - name: Install locked runtime and security tools
        run: python -m pip install --disable-pip-version-check -r requirements.lock -r requirements-security.txt
      - name: Run security checks
        env:
          PYTHON: python
          SECURITY_OUTPUT_DIR: security-artifacts
        run: ./scripts/security_checks.sh
      - name: Retain SBOM and scan output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r2c-tracker-security-artifacts
          path: security-artifacts/
          if-no-files-found: warn
          retention-days: 30

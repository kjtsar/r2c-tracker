{% extends "base.html" %}
{% block title %}Choose a New R2C Password{% endblock %}
{% block extra_head %}
<style>
  .auth-shell { max-width: 460px; margin: 48px auto; padding: 28px; background: white; border: 1px solid #ccd8df; border-radius: 14px; }
  .auth-form { display: grid; gap: 16px; }
  .auth-form label { display: grid; gap: 6px; font-weight: 700; }
  .auth-form input { padding: 11px; border: 1px solid #aebdc7; border-radius: 7px; }
  .auth-form button { padding: 11px 16px; border: 0; border-radius: 7px; background: #0b6680; color: white; font-weight: 800; }
</style>
{% endblock %}
{% block content %}
<section class="auth-shell">
  <h1>Choose a new R2C password</h1>
  <p>This single-use reset link expires 15 minutes after it was issued.</p>
  <form class="auth-form" method="post"
        action="/{{ designator|lower }}/reset-password">
    <input type="hidden" name="form_token" value="{{ csrf_token }}">
    <input id="organization-reset-token" type="hidden" name="reset_token"
           value="{{ reset_token }}">
    <label>
      New password
      <input type="password" name="new_password" required minlength="12"
             autocomplete="new-password" autofocus>
    </label>
    <label>
      Confirm new password
      <input type="password" name="new_password_confirm" required minlength="12"
             autocomplete="new-password">
    </label>
    <button type="submit">Save new password</button>
  </form>
  <script src="/static/organization_reset_password.js"></script>
</section>
{% endblock %}
